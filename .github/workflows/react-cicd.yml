name: React CI/CD Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: client
    
    - name: Build
      run: npm run build
      working-directory: client
    
    - name: Create app_offline.htm
      run: echo "<html><body><h1>Updating...</h1></body></html>" > client/dist/app_offline.htm
    
    - name: Upload app_offline first to stop IIS
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./client/dist/
        server-dir: ${{ secrets.FTP_PATH }}/
        
    - name: Wait for IIS to release files
      run: sleep 5
    
    - name: Remove app_offline before final deploy
      run: rm client/dist/app_offline.htm
    
    - name: Deploy all files to Server
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./client/dist/
        server-dir: ${{ secrets.FTP_PATH }}/
        dangerous-clean-slate: true
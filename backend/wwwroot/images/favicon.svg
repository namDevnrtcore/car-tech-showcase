<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <filter id="fs">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ff6b00" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#fb)" stroke="url(#fg)" stroke-width="2"/>
  
  <g filter="url(#fs)">
    <!-- Screen/display -->
    <rect x="12" y="14" width="40" height="26" rx="4" ry="4" 
          fill="none" stroke="url(#fg)" stroke-width="2.5"/>
    <rect x="15" y="17" width="34" height="20" rx="2" ry="2" 
          fill="url(#fg)" opacity="0.1"/>
    
    <!-- Map lines on screen -->
    <line x1="19" y1="22" x2="30" y2="22" stroke="#ff6b00" stroke-width="1.5" opacity="0.7"/>
    <line x1="19" y1="27" x2="36" y2="27" stroke="#ff8c33" stroke-width="1.5" opacity="0.5"/>
    <line x1="19" y1="32" x2="32" y2="32" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    
    <!-- GPS pin -->
    <circle cx="40" cy="21" r="3.5" fill="#ff6b00"/>
    <circle cx="40" cy="21" r="1.5" fill="#fff"/>
    
    <!-- Car body -->
    <path d="M18 44 Q20 41 26 41 L30 41 Q33 38 38 38 L42 38 Q45 38 47 41 L50 41 Q52 41 54 44 L55 47 Q55 48 54 48 L14 48 Q13 48 13 47 Z" 
          fill="url(#fg)" opacity="0.9"/>
    
    <!-- Wheels -->
    <circle cx="24" cy="48" r="3.5" fill="#333" stroke="url(#fg)" stroke-width="1.5"/>
    <circle cx="24" cy="48" r="1.5" fill="url(#fg)"/>
    <circle cx="46" cy="48" r="3.5" fill="#333" stroke="url(#fg)" stroke-width="1.5"/>
    <circle cx="46" cy="48" r="1.5" fill="url(#fg)"/>
  </g>
</svg>